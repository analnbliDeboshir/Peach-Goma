<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f4"><title>Стикерное письмо</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#fff,#ffe8ef 45%,#f8d2df);color:#6b4556;font:16px system-ui;min-height:100svh;display:grid;place-items:center;padding:12px}
#app{width:min(100%,720px);min-height:calc(100svh - 24px);display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;color:#b17b92;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 4px 12px}.progress{height:5px;background:#f3c8d8;border-radius:99px;margin-bottom:12px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#df8dab;transition:width .4s}
.panel{flex:1;min-height:0;border:1px solid #f1bbce;border-radius:26px;background:linear-gradient(160deg,#fffafa,#fff1f5);box-shadow:0 20px 55px #c67e9840;padding:clamp(20px,5vw,38px);display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto;position:relative}.panel:before,.panel:after{content:"♡";position:absolute;color:#f5bfd2;font-size:25px;opacity:.6}.panel:before{left:15px;top:10px}.panel:after{right:15px;bottom:10px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#c1829c;margin-bottom:12px}h1{font-size:clamp(32px,8vw,49px);line-height:1.05;margin:0 0 16px;color:#9c5975;letter-spacing:-.04em}h2{font-size:clamp(24px,6vw,35px);line-height:1.12;margin:0 0 12px;color:#985a73}p{line-height:1.62;margin:0 0 14px;color:#785767}
.sticker{width:min(44vw,185px);height:min(44vw,185px);object-fit:contain;display:block;margin:4px auto 12px;filter:drop-shadow(0 7px 5px #b7778b25);animation:float 3s ease-in-out infinite}.sticker.small{width:min(28vw,130px);height:min(28vw,130px);display:inline-block;margin:0 4px}.stickerpair{display:flex;justify-content:center;align-items:center;gap:8px;margin:4px auto 14px}
@keyframes float{50%{transform:translateY(-6px) rotate(1deg)}}
.letter{border-radius:18px;background:#fff;border:1px dashed #e6a7bc;padding:15px 17px;line-height:1.62;color:#815a6b;margin:10px 0 14px}.buttons{display:grid;gap:10px;margin-top:12px}button{font:inherit;border-radius:15px;padding:14px;border:1px solid #e5a7bd;background:#fff;color:#86546b;cursor:pointer}button.primary{background:#e69bb6;color:white;border-color:#e69bb6;font-weight:700;box-shadow:0 4px 0 #d285a2}button:hover{filter:brightness(1.02);transform:translateY(-1px)}.photo{width:100%;max-height:320px;object-fit:cover;border-radius:21px;border:4px solid #fff;box-shadow:0 7px 20px #bb82994d;margin:10px 0 15px}.foot{display:flex;justify-content:space-between;color:#b17b92;font-size:11px;padding:12px 4px}
@media(max-height:690px){.panel{padding:17px}.sticker{width:min(32vw,130px);height:min(32vw,130px)}.photo{max-height:220px}}
</style></head><body><div id="app"><div class="head"><span>♡ письмо в стикерах</span><span id="chapter">для Вероники</span></div><div class="progress"><span id="bar"></span></div><main class="panel" id="panel"></main><div class="foot"><span>от Димки · с любовью</span><span>можно не торопиться</span></div></div>

const S=["https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/9af008c1-d233-4db0-96ae-d733132648b3.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/5b11bc85-f5e1-43a0-b7f1-9d03fbc59a47.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/a17b35b9-c71c-4bd2-bf61-a4dabff727ac.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/82ba888f-3df8-4fbc-a042-2569955cb04b.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/34f48a6d-3996-413e-a27a-a66d27e003c8.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/5e7c5bad-6ab6-46c1-b9e8-bf29d8ddec37.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/2ebad99d-33e4-43ff-8a02-44bad208d79f.webp","https://img.stickers.cloud/packs/3b56aef8-b82b-4ed1-bc1d-f5c8beb01d79/webp/2d4a9d25-a4fe-43b6-a303-92c54e8fd75c.webp"];
let stage=0;
const $=s=>document.querySelector(s);
function btn(txt,fn,cls=""){return `<button class="${cls}" onclick="${fn}">${txt}</button>`}
function frame(tag,title,body,actions){$("#chapter").textContent=tag;$("#bar").style.width=(stage/8*100)+"%";$("#panel").innerHTML=`<div class="label">${tag}</div>${title}${body}<div class="buttons">${actions||""}</div>`}
function go(i){stage=i;show()}
function show(){
if(stage===0)frame("доставка","<h1>Тебе пришло<br>кое-что мягкое ♡</h1>",`<img class="sticker" src="${S[0]}" alt="Peach and Goma sticker"><p>Письмо немного стесняется. Поэтому оно будет открываться по кусочкам — как будто мы отправляем друг другу стикеры, только каждый из них что-то говорит.</p>`,btn("Открыть 💌","go(1)","primary"));
if(stage===1)frame("часть 1 · знакомство","<h2>Стикер, который говорит «я рад, что ты есть»</h2>",`<img class="sticker" src="${S[1]}" alt="Peach and Goma sticker"><div class="letter">Из всех случайных совпадений в моей жизни, знакомство с тобой — одно из самых любимых. Мы столько времени были где-то рядом, а теперь ты мой самый любимый человек.</div>`,btn("Дальше →","go(2)","primary"));
if(stage===2)frame("часть 2 · важные мелочи","<h2>Мне нравятся наши маленькие странности</h2>",`<div class="stickerpair"><img class="sticker small" src="${S[2]}" alt="Peach and Goma sticker"><img class="sticker small" src="${S[3]}" alt="Peach and Goma sticker"></div><div class="letter">Твои «ты мне такого никогда не говорила», хотя я только что говорил. Твои обнимашки. Твоя прямота. Твои смешные реакции. Даже обычные моменты рядом с тобой почему-то становятся теми, которые хочется запомнить.</div>`,btn("Следующий кусочек","go(3)","primary"));
if(stage===3)frame("часть 3 · без необходимости","<h2>Можно просто быть собой</h2>",`<img class="sticker" src="${S[4]}" alt="Peach and Goma sticker"><p>Тебе не нужно всегда быть весёлой, общительной, энергичной или рассказывать, что у тебя внутри, если не хочется.</p><div class="letter">Я не буду требовать от тебя улыбки, чтобы мне было спокойно. Я просто хочу, чтобы ты знала: даже в тихие, закрытые, уставшие дни ты всё равно любимая.</div>`,btn("Продолжить ♡","go(4)","primary"));
if(stage===4)frame("часть 4 · уют","<h2>Моё любимое место — рядом</h2>",`<div class="stickerpair"><img class="sticker small" src="${S[5]}" alt="Peach and Goma sticker"><img class="sticker small" src="${S[6]}" alt="Peach and Goma sticker"></div><p>Я хочу с тобой не только большие события. Хочу обычные вечера, обниматься, смотреть что-нибудь, смеяться над ерундой, засыпать рядом, гулять, заказывать шаурму и просто делить жизнь на двоих.</p>`,btn("Есть ещё одно письмо…","go(5)","primary"));
if(stage===5)frame("часть 5 · однажды","<h2>О нашем маленьком будущем</h2>",`<img class="sticker" src="${S[7]}" alt="Peach and Goma sticker"><div class="letter">Мне хочется однажды проснуться с тобой в нашем доме в тёплом месте. Чтобы у нас были свои привычки, свои смешные истории, свои планы, и чтобы всё это было не картинкой из мечты, а нашей настоящей жизнью.</div><p>Не обещаю идеальную сказку. Просто хочу строить что-то настоящее вместе с тобой.</p>`,btn("Последний конверт 💗","go(6)","primary"));
if(stage===6)frame("часть 6 · признание","<h2>Я люблю тебя. Очень.</h2>",`<div class="stickerpair"><img class="sticker small" src="${S[1]}" alt="Peach and Goma"><img class="sticker small" src="${S[4]}" alt="Peach and Goma"></div><div class="letter">Люблю твою доброту, честность, характер, твои глаза, твою красоту, твои объятия и твою способность быть именно собой. Ты не должна ничего делать, чтобы заслужить мою нежность. Я просто люблю тебя — и всё.</div>`,btn("Открыть финал","go(7)","primary"));
if(stage===7)finish();
}
function finish(){$("#chapter").textContent="последняя страница";$("#bar").style.width="100%";$("#panel").innerHTML=`<div class="label">для моей любимой</div><h2>Вероника, моя маленькая ♡</h2><img class="photo" src="${P}" alt="Фото"><p>Если вдруг сегодня всё не очень — пусть хотя бы этот маленький уголок напомнит, что ты кому-то невероятно дорога.</p><div class="letter">Я рядом не только для счастливых моментов. Ты важна для меня всегда. Я люблю тебя, Медвежонок. Твой Димки. <span style="font-size:24px">💗</span></div><div class="buttons"><button class="primary" onclick="restart()">Прочитать ещё раз ♡</button></div>`}
function restart(){stage=0;show()}
show();
</script></body></html>
